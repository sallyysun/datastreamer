<!doctype html>
<html>
<head>
  <title>WebSocket Test</title>
</head>
<body>
  <h2>WebSocket Feed</h2>
  <pre id="out"></pre>

  <script>
    const out = document.getElementById("out");

    // IMPORTANT: uses same host (works with ngrok automatically)
    const ws = new WebSocket(`wss://${window.location.host}`);

    ws.onopen = () => {
      out.textContent += "connected\n";
    };

    ws.onmessage = (event) => {
      out.textContent += event.data + "\n";
    };

    ws.onclose = () => {
      out.textContent += "disconnected\n";
    };
  </script>
</body>
</html>
